name: Notify CI Failure

# Posts to Slack when a check fails on main. Called by the `notify` job in
# tests.yaml; not triggered directly.
on:
  workflow_call:
    inputs:
      workflow:
        description: Human-readable name of the calling workflow
        required: true
        type: string
      results:
        description: toJSON(needs) from the calling workflow, to name the failed jobs
        required: true
        type: string

jobs:
  slack:
    name: Post to Slack
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Post failure to Slack
        env:
          # Untrusted values (commit subject, author) go through the environment
          # rather than `${{ }}` interpolation inside the script.
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          WORKFLOW: ${{ inputs.workflow }}
          RESULTS: ${{ inputs.results }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          failed=$(jq -r 'to_entries
            | map(select(.value.result == "failure" or .value.result == "timed_out" or .value.result == "cancelled"))
            | map(.key) | join(", ")' <<<"$RESULTS")
          [ -n "$failed" ] || failed="unknown"

          jq -n \
            --arg text "$WORKFLOW failed on $BRANCH: $failed" \
            --arg workflow "$WORKFLOW" \
            --arg failed "$failed" \
            --arg subject "$(head -n1 <<<"$COMMIT_MESSAGE")" \
            --arg author "$COMMIT_AUTHOR" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg sha "${SHA:0:8}" \
            --arg url "$RUN_URL" \
            '{
              text: $text,
              blocks: [
                { type: "header",
                  text: { type: "plain_text", text: ("🔴 " + $workflow + " failed on " + $branch) } },
                { type: "section",
                  fields: [
                    { type: "mrkdwn", text: ("*Failed jobs*\n" + $failed) },
                    { type: "mrkdwn", text: ("*Repo*\n" + $repo) },
                    { type: "mrkdwn", text: ("*Commit*\n`" + $sha + "` " + $subject) },
                    { type: "mrkdwn", text: ("*Author*\n" + $author) }
                  ] },
                { type: "actions",
                  elements: [
                    { type: "button", url: $url,
                      text: { type: "plain_text", text: "View run" } }
                  ] }
              ]
            }' > payload.json

          curl --fail-with-body --silent --show-error \
            -X POST -H 'Content-Type: application/json' \
            --data @payload.json "$WEBHOOK"
