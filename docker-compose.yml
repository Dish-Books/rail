# The rail VM's stack (dishbooks .devops/terraform/shared/rail.tf); scripts/deploy.sh brings it up.
# Host networking, so agents reach worktree apps and the shared services on localhost.
# Rail mounts /srv/rail at the same path it uses: worktree and scratch paths live in the DB.
# Rail holds the docker socket to run each task's agents, setup and CI in a sandbox of the task's
# own: a Docker volume holding its checkout, and while it has work a container whose rail-runner
# dials Rail's /sandbox/socket (docs/sandbox-socket.md). It keeps running across a deploy. Of
# /srv/rail it mounts only its task's scratch folder and its account's login, until RAIL-228, and
# the toolchains through the rail-mise volume, read-only. The browser mounts only its profile.
# The same way, it starts one rail-browser container: the headless Chrome every QA and demo pass
# drives, a tab per task, which a deploy leaves open.
# Agents still get no docker socket; a project's other services are started on the host, outside this stack.

x-rail-env: &rail-env
  DATABASE_URL: ecto://postgres:postgres@localhost:5432/rail_prod
  PHX_HOST: rail.dishbooks.com
  RAIL_SCRATCH_ROOT: /srv/rail/scratch
  RAIL_TASKS_ROOT: /srv/rail/tasks
  RAIL_BACKENDS_ROOT: /srv/rail/backends
  MISE_DATA_DIR: /srv/rail/mise
  MISE_TRUSTED_CONFIG_PATHS: /srv/rail/projects:/srv/rail/tasks

# Tags each log line with its compose service, which otel-collector ships under.
x-logging: &logging
  driver: json-file
  options:
    labels: com.docker.compose.service

services:
  # One Postgres for rail and every project worktree. postgres/postgres because project dev
  # configs hardcode it; it listens on localhost only. Settings match dishbooks' init.sql.
  db:
    logging: *logging
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    # Docker's 64 MB /dev/shm is too small for the shared stats of every sandbox database this Postgres holds:
    # growing them failed with "No space left on device" and a backend then crashed with a segfault.
    shm_size: 1gb
    command:
      - postgres
      - -c
      - listen_addresses=localhost
      - -c
      - max_connections=500
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=64
      - -c
      - max_replication_slots=64
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rail_prod
    volumes:
      - /srv/rail/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d rail_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    logging: *logging
    image: rail:latest
    pull_policy: never
    network_mode: host
    env_file: .env
    environment: *rail-env
    command: ["eval", "Rail.Release.migrate()"]
    # Some migrations rewrite the files tasks keep under /srv/rail; without it they find none and skip.
    volumes:
      - /srv/rail:/srv/rail
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  rail:
    logging: *logging
    build: .
    image: rail:latest
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      <<: *rail-env
      RAIL_SANDBOX_RUNTIME: docker
      RAIL_SANDBOX_IMAGE: rail-sandbox:latest
      RAIL_TOOLCHAIN_VOLUME: rail-mise
      RAIL_BROWSER_ROOT: /srv/rail/browser
    # The docker group's id on the host (scripts/deploy.sh), so rail can use the socket.
    group_add: ["${DOCKER_GID}"]
    # Reaps whatever rail spawns detached.
    init: true
    volumes:
      - /srv/rail:/srv/rail
      # Over the bind above: Rail installs toolchains here, and sandboxes read them from the same volume.
      - rail-mise:/srv/rail/mise
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully

  cloudflared:
    logging: *logging
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}

  # Lets Devhub reach the db on localhost; databases only, no Kubernetes.
  devhub-tunnel:
    logging: *logging
    image: ghcr.io/devhub-tools/devhub-tunnel:v3.1.2
    restart: unless-stopped
    network_mode: host
    environment:
      DEVHUB_TUNNEL_KUBERNETES: "false"
    volumes:
      - ./devhub-tunnel.json:/etc/devhub-tunnel/config.json:ro

  # Only started when .env carries POSTHOG_API_KEY; scripts/deploy.sh turns the profile on.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    profiles: [posthog]
    restart: unless-stopped
    network_mode: host
    # Root to read the docker daemon's container logs.
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      POSTHOG_API_KEY: ${POSTHOG_API_KEY}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /srv/rail/otel-collector:/var/lib/otelcol

volumes:
  # Made and filled from /srv/rail/mise by scripts/deploy.sh, so its name is its own and not the project's.
  rail-mise:
    external: true
